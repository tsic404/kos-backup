name: CI

# The check a pull request can show before it is merged. The steps mirror the
# Makefile entry points one to one: formatting, vet and the modules' syntax
# check, then the Go cases (artifact and install/uninstall) and the browser-side
# cases (the page's data surface).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format, vet and syntax check
        run: make verify

      - name: Unit and acceptance tests
        run: make test

      - name: Artifact
        run: make package
